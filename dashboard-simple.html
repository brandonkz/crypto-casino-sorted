<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Casino Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .stat-label {
            font-size: 0.875rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
        }

        .stat-subtext {
            font-size: 0.875rem;
            color: #888;
            margin-top: 8px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chart-card.wide {
            grid-column: 1 / -1;
        }

        .chart-card h2 {
            font-size: 1.25rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            height: 350px;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎰 Crypto Casino Analytics</h1>
            <p>Real-time deposit tracking across major casinos</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Volume</div>
                <div class="stat-value" id="totalVolume">Loading...</div>
                <div class="stat-subtext" id="totalDeposits"></div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Average Deposit</div>
                <div class="stat-value" id="avgDeposit">Loading...</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Biggest Deposit</div>
                <div class="stat-value" id="biggestDeposit">Loading...</div>
                <div class="stat-subtext" id="biggestCasino"></div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Casinos Tracked</div>
                <div class="stat-value" id="totalCasinos">7</div>
                <div class="stat-subtext">Ethereum mainnet</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h2>Volume by Casino (USD)</h2>
                <div class="chart-container">
                    <canvas id="volumeChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Number of Deposits</h2>
                <div class="chart-container">
                    <canvas id="depositsChart"></canvas>
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card wide">
                <h2>Casino Comparison</h2>
                <div class="chart-container">
                    <canvas id="comparisonChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Parse CSV properly
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const rows = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current);
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current);
                rows.push(values);
            }
            return rows;
        }

        // Normalize casino name (combine Stake wallets)
        function normalizeCasino(name) {
            if (name.includes('Stake')) return 'Stake';
            if (name.includes('Rollbit')) return 'Rollbit';
            return name;
        }

        // Load and analyze data
        fetch('./data/deposits-all.csv')
            .then(response => response.text())
            .then(text => {
                const rows = parseCSV(text);
                
                // Aggregate by casino
                const casinoData = {};
                let totalVolume = 0;
                let biggestDeposit = { value: 0, casino: '' };
                
                rows.forEach(row => {
                    const casino = normalizeCasino(row[3]); // Casino column
                    const usdValue = parseFloat(row[7]) || 0; // USD Value column
                    
                    if (!casinoData[casino]) {
                        casinoData[casino] = { volume: 0, count: 0 };
                    }
                    
                    casinoData[casino].volume += usdValue;
                    casinoData[casino].count += 1;
                    totalVolume += usdValue;
                    
                    if (usdValue > biggestDeposit.value) {
                        biggestDeposit = { value: usdValue, casino };
                    }
                });
                
                const totalDeposits = rows.length;
                const avgDeposit = totalVolume / totalDeposits;
                
                // Update stats
                document.getElementById('totalVolume').textContent = '$' + (totalVolume / 1000000).toFixed(2) + 'M';
                document.getElementById('totalDeposits').textContent = totalDeposits.toLocaleString() + ' deposits';
                document.getElementById('avgDeposit').textContent = '$' + avgDeposit.toFixed(0);
                document.getElementById('biggestDeposit').textContent = '$' + biggestDeposit.value.toLocaleString(undefined, { maximumFractionDigits: 0 });
                document.getElementById('biggestCasino').textContent = biggestDeposit.casino;
                
                // Sort casinos by volume
                const casinos = Object.keys(casinoData).sort((a, b) => casinoData[b].volume - casinoData[a].volume);
                const volumes = casinos.map(c => casinoData[c].volume);
                const counts = casinos.map(c => casinoData[c].count);
                
                const colors = ['#8b5cf6', '#ec4899', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#6366f1'];
                
                // Volume chart (bar)
                new Chart(document.getElementById('volumeChart'), {
                    type: 'bar',
                    data: {
                        labels: casinos,
                        datasets: [{
                            label: 'Volume (USD)',
                            data: volumes,
                            backgroundColor: colors,
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: (context) => '$' + context.parsed.y.toLocaleString(undefined, { maximumFractionDigits: 0 })
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: (value) => '$' + (value / 1000000).toFixed(1) + 'M'
                                }
                            }
                        }
                    }
                });
                
                // Deposits chart (bar)
                new Chart(document.getElementById('depositsChart'), {
                    type: 'bar',
                    data: {
                        labels: casinos,
                        datasets: [{
                            label: 'Deposits',
                            data: counts,
                            backgroundColor: colors,
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
                
                // Comparison chart (grouped bar)
                new Chart(document.getElementById('comparisonChart'), {
                    type: 'bar',
                    data: {
                        labels: casinos,
                        datasets: [
                            {
                                label: 'Volume ($M)',
                                data: volumes.map(v => v / 1000000),
                                backgroundColor: '#8b5cf6',
                                borderRadius: 8,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Deposits (hundreds)',
                                data: counts.map(c => c / 100),
                                backgroundColor: '#ec4899',
                                borderRadius: 8,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: {
                                    display: true,
                                    text: 'Volume ($M)'
                                }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: {
                                    display: true,
                                    text: 'Deposits (hundreds)'
                                },
                                grid: {
                                    drawOnChartArea: false
                                }
                            }
                        }
                    }
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('totalVolume').textContent = 'Error';
            });
    </script>
</body>
</html>
