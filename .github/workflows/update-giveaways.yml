name: Update Giveaways

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes
  workflow_dispatch:           # Manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run giveaways scraper (casino accounts)
        run: python3 update-giveaways.py --quick

      - name: Commit updated giveaways.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/giveaways.json
          git diff --cached --quiet || git commit -m "chore: update giveaways data [skip ci]"
          git push
