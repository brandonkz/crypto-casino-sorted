<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Casino Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .stat-label {
            font-size: 0.875rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
        }

        .stat-change {
            font-size: 0.875rem;
            margin-top: 8px;
        }

        .stat-change.positive {
            color: #10b981;
        }

        .stat-change.negative {
            color: #ef4444;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chart-card h2 {
            font-size: 1.25rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .chart-container.tall {
            height: 400px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }

        .error {
            background: #ef4444;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

            </div>

        // Parse CSV
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',');
            
            return lines.slice(1).map(line => {
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current);
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current);
                
                const obj = {};
                headers.forEach((header, i) => {
                    obj[header.trim()] = values[i]?.trim() || '';
                });
                return obj;
            });
        }

    async function loadData() {
        // Use embedded data instead of fetch
        try {
            const data = parseCSV(EMBEDDED_CSV);
  
            try {
                // Data already loaded from EMBEDDED_CSV above
                
                // Analyze data
                const totalVolume = data.reduce((sum, d) => sum + parseFloat(d['USD Value'] || 0), 0);
                const totalDeposits = data.length;
                const avgDeposit = totalVolume / totalDeposits;
                
                const biggest = data.reduce((max, d) => {
                    const val = parseFloat(d['USD Value'] || 0);
                    return val > max.value ? { value: val, casino: d.Casino } : max;
                }, { value: 0, casino: '' });
                
                // Update stats
                document.getElementById('totalVolume').textContent = '$' + totalVolume.toLocaleString('en-US', { maximumFractionDigits: 0 });
                document.getElementById('totalDeposits').textContent = totalDeposits.toLocaleString();
                document.getElementById('avgDeposit').textContent = '$' + avgDeposit.toLocaleString('en-US', { maximumFractionDigits: 2 });
                document.getElementById('biggestDeposit').textContent = '$' + biggest.value.toLocaleString('en-US', { maximumFractionDigits: 2 });
                document.getElementById('biggestCasino').textContent = biggest.casino;
                
                // Casino breakdown
                const casinoStats = {};
                data.forEach(d => {
                    const casino = d.Casino;
                    if (!casinoStats[casino]) {
                        casinoStats[casino] = { volume: 0, count: 0 };
                    }
                    casinoStats[casino].volume += parseFloat(d['USD Value'] || 0);
                    casinoStats[casino].count += 1;
                });
                
                // Hourly breakdown
                const hourlyStats = Array(24).fill(0);
                data.forEach(d => {
                    const time = d.Time;
                    if (time) {
                        const hour = parseInt(time.split(':')[0]);
                        hourlyStats[hour] += parseFloat(d['USD Value'] || 0);
                    }
                });
                
                // Size distribution
                const ranges = [
                    { label: '<$100', min: 0, max: 100, count: 0 },
                    { label: '$100-500', min: 100, max: 500, count: 0 },
                    { label: '$500-1K', min: 500, max: 1000, count: 0 },
                    { label: '$1K-5K', min: 1000, max: 5000, count: 0 },
                    { label: '$5K-10K', min: 5000, max: 10000, count: 0 },
                    { label: '>$10K', min: 10000, max: Infinity, count: 0 }
                ];
                
                data.forEach(d => {
                    const val = parseFloat(d['USD Value'] || 0);
                    const range = ranges.find(r => val >= r.min && val < r.max);
                    if (range) range.count++;
                });
                
                // Create charts
                createCharts(casinoStats, hourlyStats, ranges);
                
                // Show content
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                const errorEl = document.getElementById('error');
                errorEl.textContent = 'Error loading data: ' + error.message;
                errorEl.style.display = 'block';
            }
        }

        function createCharts(casinoStats, hourlyStats, ranges) {
            const casinos = Object.keys(casinoStats);
            const colors = ['#8b5cf6', '#ec4899', '#3b82f6', '#10b981'];
            
            // Volume by Casino (Pie)
            new Chart(document.getElementById('casinoChart'), {
                type: 'doughnut',
                data: {
                    labels: casinos,
                    datasets: [{
                        data: casinos.map(c => casinoStats[c].volume),
                        backgroundColor: colors,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const value = context.parsed;
                                    return context.label + ': $' + value.toLocaleString('en-US', { maximumFractionDigits: 0 });
                                }
                            }
                        }
                    }
                }
            });
            
            // Deposits by Casino (Bar)
            new Chart(document.getElementById('depositsChart'), {
                type: 'bar',
                data: {
                    labels: casinos,
                    datasets: [{
                        label: 'Deposits',
                        data: casinos.map(c => casinoStats[c].count),
                        backgroundColor: colors,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
            
            // Hourly Activity
            new Chart(document.getElementById('hourlyChart'), {
                type: 'line',
                data: {
                    labels: Array.from({ length: 24 }, (_, i) => i + ':00'),
                    datasets: [{
                        label: 'Volume ($)',
                        data: hourlyStats,
                        borderColor: '#8b5cf6',
                        backgroundColor: 'rgba(139, 92, 246, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: (value) => '$' + (value / 1000).toFixed(0) + 'K'
                            }
                        }
                    }
                }
            });
            
            // Distribution
            new Chart(document.getElementById('distributionChart'), {
                type: 'bar',
                data: {
                    labels: ranges.map(r => r.label),
                    datasets: [{
                        label: 'Deposits',
                        data: ranges.map(r => r.count),
                        backgroundColor: '#8b5cf6',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
            
            // Average by Casino
            new Chart(document.getElementById('avgCasinoChart'), {
                type: 'bar',
                data: {
                    labels: casinos,
                    datasets: [{
                        label: 'Avg Deposit ($)',
                        data: casinos.map(c => casinoStats[c].volume / casinoStats[c].count),
                        backgroundColor: colors,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: (value) => '$' + value.toFixed(0)
                            }
                        }
                    }
                }
            });
        }

        // Load on page load
        loadData();
    </script>
