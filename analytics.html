<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Casino Analytics | CryptoCasinoSorted</title>
    <meta name="description" content="Real-time crypto casino analytics across 13 casinos and 5 blockchains. Track volume, whales, and trends.">
    <link rel="canonical" href="https://cryptocasinosorted.com/analytics.html">
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        .header {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
            padding: 2rem 0;
            text-align: center;
            border-bottom: 2px solid #8b5cf6;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-meta {
            color: #9ca3af;
            font-size: 0.875rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .dashboard-card {
            background: rgba(15, 15, 20, 0.98);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #8b5cf6;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-large {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-small {
            color: #9ca3af;
            font-size: 0.875rem;
        }

        .chain-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: rgba(139, 92, 246, 0.05);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .chain-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .chain-icon {
            font-size: 1.25rem;
        }

        .chain-stats {
            text-align: right;
        }

        .chain-volume {
            font-weight: 700;
            color: #8b5cf6;
        }

        .chain-count {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .casino-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(139, 92, 246, 0.05);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            transition: all 0.2s;
        }

        .casino-item:hover {
            background: rgba(139, 92, 246, 0.1);
            transform: translateX(4px);
        }

        .casino-rank {
            font-size: 1.5rem;
            font-weight: 800;
            color: #9ca3af;
            margin-right: 1rem;
            min-width: 2rem;
        }

        .casino-info {
            flex: 1;
        }

        .casino-name {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .casino-meta {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .casino-volume {
            font-size: 1.25rem;
            font-weight: 700;
            color: #8b5cf6;
            text-align: right;
        }

        .whale-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.05) 0%, rgba(236, 72, 153, 0.05) 100%);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(139, 92, 246, 0.1);
        }

        .whale-info {
            flex: 1;
        }

        .whale-amount {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .whale-meta {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .whale-casino {
            padding: 0.25rem 0.75rem;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #8b5cf6;
            margin-top: 0.5rem;
            display: inline-block;
        }

        .market-share {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .share-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .share-bar-bg {
            flex: 1;
            height: 2rem;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .share-bar {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6 0%, #ec4899 100%);
            transition: width 1s ease-out;
            display: flex;
            align-items: center;
            padding: 0 0.75rem;
            font-size: 0.875rem;
            font-weight: 700;
        }

        .share-label {
            min-width: 80px;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .share-percent {
            min-width: 50px;
            text-align: right;
            font-weight: 700;
            color: #8b5cf6;
            font-size: 0.875rem;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #9ca3af;
        }

        .loading-spinner {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .wide-card {
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.75rem;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>📊 Live Casino Analytics</h1>
        <div class="header-meta" id="headerMeta">Loading real-time data...</div>
    </header>

    <div class="container">
        <div id="loading" class="loading">
            <div class="loading-spinner">⏳</div>
            <div>Loading multi-chain analytics...</div>
        </div>

        <div id="content" style="display: none;">
            <!-- Top Stats -->
            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <div class="card-title">💰 Total Volume</div>
                    <div class="stat-large" id="totalVolume">$0</div>
                    <div class="stat-small" id="totalBets">0 deposits</div>
                </div>

                <div class="dashboard-card">
                    <div class="card-title">🎰 Casinos</div>
                    <div class="stat-large" id="totalCasinos">0</div>
                    <div class="stat-small">Tracked across 5 chains</div>
                </div>

                <div class="dashboard-card">
                    <div class="card-title">🔗 Chains</div>
                    <div class="stat-large" id="activeChains">0</div>
                    <div class="stat-small">Active blockchains</div>
                </div>

                <div class="dashboard-card">
                    <div class="card-title">📈 Avg Deposit</div>
                    <div class="stat-large" id="avgDeposit">$0</div>
                    <div class="stat-small" id="biggestDeposit">Biggest: $0</div>
                </div>
            </div>

            <!-- Chain Breakdown -->
            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <div class="card-title">🔗 Chain Breakdown</div>
                    <div id="chainBreakdown"></div>
                </div>

                <div class="dashboard-card">
                    <div class="card-title">🐋 Whale Watch</div>
                    <div id="whaleList"></div>
                </div>
            </div>

            <!-- Market Share -->
            <div class="dashboard-grid">
                <div class="dashboard-card wide-card">
                    <div class="card-title">📊 Casino Market Share</div>
                    <div class="market-share" id="marketShare"></div>
                </div>
            </div>

            <!-- Casino Rankings -->
            <div class="dashboard-grid">
                <div class="dashboard-card wide-card">
                    <div class="card-title">🏆 Casino Rankings</div>
                    <div id="casinoRankings"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chainConfig = {
            eth: { name: 'Ethereum', icon: '⟠', color: '#627eea' },
            bsc: { name: 'BSC', icon: '🔶', color: '#f3ba2f' },
            polygon: { name: 'Polygon', icon: '🟣', color: '#8247e5' },
            arbitrum: { name: 'Arbitrum', icon: '🔵', color: '#28a0f0' },
            base: { name: 'Base', icon: '🔷', color: '#0052ff' }
        };

        async function loadData() {
            try {
                const response = await fetch('/live-bets.json');
                const data = await response.json();
                
                if (!data || !data.bets || !data.stats) {
                    throw new Error('Invalid data format');
                }

                renderAnalytics(data);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').innerHTML = `
                    <div>❌ Error loading data</div>
                    <div style="font-size: 0.875rem; margin-top: 0.5rem;">
                        Run the tracker to generate data: <code>node fetch-multi-chain-bets.js</code>
                    </div>
                `;
            }
        }

        function renderAnalytics(data) {
            const { bets, stats } = data;
            
            // Header meta
            const lastUpdate = new Date(data.lastUpdated);
            document.getElementById('headerMeta').textContent = 
                `Last updated: ${lastUpdate.toLocaleString()} • ${bets.length} deposits tracked`;

            // Top stats
            document.getElementById('totalVolume').textContent = 
                '$' + (stats.totalVolume / 1000).toFixed(1) + 'k';
            document.getElementById('totalBets').textContent = 
                `${bets.length} deposits`;
            document.getElementById('totalCasinos').textContent = 
                stats.casinos.length;
            document.getElementById('activeChains').textContent = 
                Object.keys(stats.chains).filter(c => stats.chains[c].deposits > 0).length;
            
            const avgDep = stats.totalVolume / bets.length;
            document.getElementById('avgDeposit').textContent = 
                '$' + avgDep.toFixed(0);
            
            const biggest = Math.max(...bets.map(b => b.usdValue));
            document.getElementById('biggestDeposit').textContent = 
                `Biggest: $${biggest.toLocaleString()}`;

            // Chain breakdown
            const chainHtml = Object.entries(stats.chains)
                .filter(([_, data]) => data.deposits > 0)
                .sort((a, b) => b[1].volume - a[1].volume)
                .map(([chain, data]) => {
                    const config = chainConfig[chain] || { name: chain, icon: '🔗' };
                    return `
                        <div class="chain-item">
                            <div class="chain-name">
                                <span class="chain-icon">${config.icon}</span>
                                <span>${config.name}</span>
                            </div>
                            <div class="chain-stats">
                                <div class="chain-volume">$${(data.volume / 1000).toFixed(1)}k</div>
                                <div class="chain-count">${data.deposits} deposits</div>
                            </div>
                        </div>
                    `;
                }).join('');
            document.getElementById('chainBreakdown').innerHTML = chainHtml;

            // Whale watch (top 5 biggest deposits)
            const whales = [...bets]
                .sort((a, b) => b.usdValue - a.usdValue)
                .slice(0, 5);
            
            const whaleHtml = whales.map(bet => {
                const timeAgo = Math.floor((Date.now() - new Date(bet.timestamp)) / 60000);
                return `
                    <div class="whale-item">
                        <div class="whale-info">
                            <div class="whale-amount">$${bet.usdValue.toLocaleString()}</div>
                            <div class="whale-meta">
                                ${bet.crypto.amount} ${bet.crypto.symbol} • ${timeAgo}m ago
                            </div>
                            <div class="whale-casino">${bet.casino.icon} ${bet.casino.name}</div>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('whaleList').innerHTML = whaleHtml;

            // Casino market share
            const casinoVolumes = {};
            bets.forEach(bet => {
                const name = bet.casino.name;
                if (!casinoVolumes[name]) {
                    casinoVolumes[name] = { volume: 0, icon: bet.casino.icon };
                }
                casinoVolumes[name].volume += bet.usdValue;
            });

            const sortedCasinos = Object.entries(casinoVolumes)
                .sort((a, b) => b[1].volume - a[1].volume)
                .slice(0, 8);

            const marketShareHtml = sortedCasinos.map(([name, data]) => {
                const percent = (data.volume / stats.totalVolume * 100);
                return `
                    <div class="share-item">
                        <div class="share-label">${data.icon} ${name}</div>
                        <div class="share-bar-bg">
                            <div class="share-bar" style="width: ${percent}%"></div>
                        </div>
                        <div class="share-percent">${percent.toFixed(1)}%</div>
                    </div>
                `;
            }).join('');
            document.getElementById('marketShare').innerHTML = marketShareHtml;

            // Casino rankings
            const casinoStats = {};
            bets.forEach(bet => {
                const name = bet.casino.name;
                if (!casinoStats[name]) {
                    casinoStats[name] = {
                        volume: 0,
                        count: 0,
                        icon: bet.casino.icon,
                        chains: new Set()
                    };
                }
                casinoStats[name].volume += bet.usdValue;
                casinoStats[name].count++;
                casinoStats[name].chains.add(bet.chain.name);
            });

            const rankings = Object.entries(casinoStats)
                .sort((a, b) => b[1].volume - a[1].volume);

            const rankingsHtml = rankings.map(([name, data], index) => {
                const avgDep = data.volume / data.count;
                return `
                    <div class="casino-item">
                        <div class="casino-rank">#${index + 1}</div>
                        <div class="casino-info">
                            <div class="casino-name">${data.icon} ${name}</div>
                            <div class="casino-meta">
                                ${data.count} deposits • ${[...data.chains].join(', ')} • Avg: $${avgDep.toFixed(0)}
                            </div>
                        </div>
                        <div class="casino-volume">$${(data.volume / 1000).toFixed(1)}k</div>
                    </div>
                `;
            }).join('');
            document.getElementById('casinoRankings').innerHTML = rankingsHtml;
        }

        // Load data on page load
        loadData();

        // Refresh every 5 minutes
        setInterval(loadData, 300000);
    </script>
</body>
</html>
